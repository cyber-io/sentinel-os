[package]
name = "sentinel-operator-tui"
version = "0.1.0"
edition = "2021"
description = "Sentinel OS Operator TUI - terminal interface for security operations"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = { version = "0.27", features = ["event-stream"] }
futures = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "ws"] }
url = "2.5"
base64 = "0.22"
dirs = "5.0"
config = "0.13"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"