[package]
name = "sentinel-capability-broker"
version = "0.1.0"
edition = "2021"
description = "Sentinel OS Capability Broker - validates compartment requests and issues capability tokens"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-serde = "0.9"
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
base64 = "0.22"
hex = "0.4"
notify = "6.1"
tokio-stream = "0.1"
futures = "0.3"
axum = { version = "0.7", features = ["macros", "json", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"