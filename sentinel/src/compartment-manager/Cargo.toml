[package]
name = "sentinel-compartment-manager"
version = "0.1.0"
edition = "2021"
description = "Sentinel OS Compartment Manager - spawns and manages isolated compartments"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
tempfile = "3.8"
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros", "json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
nix = "0.27"
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"