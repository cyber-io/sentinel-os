version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/sentinel/src/capability-broker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "capability-broker"
    commit-message:
      prefix: "deps(capability-broker):"

  - package-ecosystem: "cargo"
    directory: "/sentinel/src/compartment-manager"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
