name: Sentinel OS CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 2 AM
  workflow_dispatch:

env:
  RUST_VERSION: '1.82'
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # Lint & Format Checks
  # =========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: sentinel-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check for security vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Check dependencies
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories bans licenses sources

  # =========================================================================
  # Unit Tests
  # =========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        service:
          - capability-broker
          - compartment-manager
          - ai-orchestrator
          - model-registry
          - threat-intel
          - attestation-service
          - health-check
          - operator-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: sentinel-test-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles('sentinel/src/${{ matrix.service }}/Cargo.lock') }}

      - name: Run unit tests
        working-directory: sentinel/src/${{ matrix.service }}
        run: cargo test --all-features

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: sentinel/src/${{ matrix.service }}/target/coverage/
          retention-days: 7

  # =========================================================================
  # NixOS Configuration Build
  # =========================================================================
  nixos-build:
    name: NixOS Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        config:
          - dev-vm
          - hardened
          - installer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Verify flake
        run: nix flake check

      - name: Build NixOS configuration
        run: |
          nix build ".#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel" \
            --no-link --print-build-logs

      - name: Build ISO (for installer)
        if: matrix.config == 'installer'
        run: |
          nix build ".#nixosConfigurations.installer.config.system.build.isoImage" \
            --no-link --print-build-logs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nixos-${{ matrix.config }}-build
          path: result*
          retention-days: 7

  # =========================================================================
  # Docker Image Build
  # =========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, unit-tests]
    strategy:
      matrix:
        service:
          - capability-broker
          - compartment-manager
          - ai-orchestrator
          - model-registry
          - threat-intel
          - attestation-service
          - health-check
          - operator-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sentinel/src/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # =========================================================================
  # Integration Tests
  # =========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
          # Wait for services to be healthy
          sleep 30

      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml run --rm test-runner

      - name: Run contract tests
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml run --rm test-runner contract

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > test-logs.txt

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: test-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.test.yml down -v

  # =========================================================================
  # VM Tests (QEMU)
  # =========================================================================
  vm-tests:
    name: VM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [nixos-build]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      matrix:
        config:
          - dev-vm
          - hardened
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Build VM image
        run: |
          nix build ".#nixosConfigurations.${{ matrix.config }}.config.system.build.vm" \
            --no-link --print-build-logs

      - name: Run VM smoke test
        run: |
          # Start VM in background
          ./result/bin/run-*-vm -nographic -serial mon:stdio &
          VM_PID=$!

          # Wait for boot
          sleep 60

          # Run basic health checks
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i ./result/ssh_host_key root@localhost -p 2222 \
            'systemctl is-system-running --wait' || true

          # Shutdown
          kill $VM_PID || true
          wait $VM_PID || true

      - name: Upload VM test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-${{ matrix.config }}
          path: vm-test-results/
          retention-days: 7

  # =========================================================================
  # SBOM Generation
  # =========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM for each service
        run: |
          mkdir -p sbom
          for service in capability-broker compartment-manager ai-orchestrator model-registry threat-intel attestation-service health-check operator-tui; do
            syft packages "ghcr.io/${{ github.repository }}/$service:latest" -o cyclonedx-json > "sbom/$service-sbom.json"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  # =========================================================================
  # Security Scan
  # =========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/*:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype
        uses: anchore/grype-action@v1
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/*:latest'

  # =========================================================================
  # Release
  # =========================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests, nixos-build, docker-build, integration-tests, security-scan, sbom]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            sbom/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NixOS ISO
        if: always()
        run: |
          # Upload ISO to release
          gh release upload ${{ github.ref_name }} ./result/iso/*.iso --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Notify
  # =========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests, nixos-build, docker-build, integration-tests, vm-tests, security-scan]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.nixos-build.result }}" == "success" && \
                "${{ needs.docker-build.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" && \
                "${{ needs.vm-tests.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "overall=success" >> $GITHUB_OUTPUT
          else
            echo "overall=failure" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        if: steps.status.outputs.overall == 'failure'
        run: |
          echo "::warning::Sentinel OS CI/CD pipeline failed. Check GitHub Actions for details."